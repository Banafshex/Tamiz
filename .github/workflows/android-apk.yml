name: Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # gradle.properties in this Windows-oriented checkout pins org.gradle.java.home to an
      # Android Studio path that does not exist on GitHub's Linux runner. Use setup-java's JDK.
      - name: Select runner JDK
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          sed -i 's/ -Djdk\.net\.unixdomain\.tmpdir=[^ ]*//' gradle.properties

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease -PmlmTestSign

      - name: Collect universal APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk -type f -name '*universal*release.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            echo 'Universal release APK was not produced.' >&2
            find app/build/outputs/apk -type f -print >&2 || true
            exit 1
          fi
          mkdir -p artifacts
          cp "$apk" artifacts/psiphon-focused-universal.apk
          echo "path=artifacts/psiphon-focused-universal.apk" >> "$GITHUB_OUTPUT"
          sha256sum artifacts/psiphon-focused-universal.apk | tee artifacts/SHA256SUMS.txt

      - name: Upload APK artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: psiphon-focused-universal-apk
          path: |
            artifacts/psiphon-focused-universal.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Add download link to run summary
        run: |
          echo '## Android APK' >> "$GITHUB_STEP_SUMMARY"
          echo '[Download the signed universal APK artifact](${{ steps.upload.outputs.artifact-url }})' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'This build uses the debug signing key and is for testing; it is not a Play Store release.' >> "$GITHUB_STEP_SUMMARY"
          echo 'SHA-256:' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
